# MyResty HTTP 主配置（自包含）
# 启动：bin/start.sh  →  nginx -p <root> -c nginx/conf/nginx.conf
# 相对路径均相对 nginx 前缀（-p）；include 相对本配置文件所在目录。

# 以 root 运行时可打开并改为 www-data；以普通用户运行请保持注释。
# user  www-data www-data;

worker_processes  auto;
pid               run/nginx.pid;
error_log         logs/error.log warn;

events {
    use epoll;
    worker_connections 65535;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    server_names_hash_bucket_size 128;
    client_header_buffer_size     32k;
    large_client_header_buffers   4 32k;
    client_body_buffer_size       50m;
    client_max_body_size          50m;
    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 60;
    tcp_nodelay       on;
    request_pool_size 1k;
    lua_socket_buffer_size 1k;

    gzip             on;
    gzip_comp_level  6;
    gzip_min_length  1k;
    gzip_buffers     4 16k;
    gzip_http_version 1.0;
    gzip_disable "MSIE [1-6].";
    gzip_types text/plain application/x-javascript text/css application/xml application/json text/javascript;
    gzip_vary    on;

    lua_shared_dict rate_limit    10m;
    lua_shared_dict session_store 10m;
    lua_shared_dict my_resty_cache 10m;

    # 启动期加载配置/中间件/路由（init.lua 内用 ngx.config.prefix() 设置 package.path）
    init_by_lua_file        init.lua;
    init_worker_by_lua_file init_worker.lua;

    include myresty.conf;
}

# ================= TCP/UDP (L4 网关) =================
stream {
    lua_shared_dict tcpudp_stats 10m;

    # stream 子系统独立设置 package.path/cpath 并预热转发规则
    init_by_lua_file        lua/stream_init.lua;
    init_worker_by_lua_file lua/worker.lua;

    # 由 nginx/conf/forward.lua 生成（bin/sync-conf.sh）
    include stream.d/forward.conf;
}
