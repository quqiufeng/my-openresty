# MyResty API 服务器（Lua 文件路径相对 nginx 前缀 -p）
server {
    listen 8080;
    server_name localhost;

    lua_need_request_body on;

    root html;
    index index.lua;

    access_log logs/access.log;
    error_log  logs/error.log warn;

    location / {
        rewrite_by_lua_file       middleware/rewrite.lua;
        access_by_lua_file        middleware/access.lua;
        content_by_lua_file       bootstrap.lua;
        header_filter_by_lua_file middleware/header_filter.lua;
        body_filter_by_lua_file   middleware/body_filter.lua;
        log_by_lua_file           middleware/log.lua;
    }

    location /static {
        alias static;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        content_by_lua "ngx.say(\"OK\")";
    }

    location ~ \.lua$ {
        deny all;
    }
}
