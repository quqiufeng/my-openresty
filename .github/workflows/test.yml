name: MyResty Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup LuaJIT and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libssl-dev
          # The framework/specs reference an absolute project path.
          sudo mkdir -p /var/www/web
          sudo ln -sfn "$PWD" /var/www/web/my-openresty

      - name: Run unit tests (app.utils.test framework)
        run: luajit tests/unit/run.lua

      - name: Run legacy QueryBuilder / Model tests
        run: |
          luajit tests/unit/query_builder_test.lua
          luajit tests/unit/model_join_test.lua
          luajit tests/unit/model_prefix_test.lua
