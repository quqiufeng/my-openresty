# MyResty TCP/UDP Framework —— 主配置
# 运行：bin/start.sh   （内部 nginx -p <root> -c conf/nginx.conf）
# 说明：仅使用 stream(L4)，无需 http。转发规则由 conf/forward.lua 描述，
#       经 bin/sync-conf.sh 生成 conf/stream.d/forward.conf 后 include。

worker_processes auto;
error_log logs/error.log info;
pid       run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

stream {
    # 共享字典：负载均衡计数 / 健康状态 / 运行统计
    lua_shared_dict tcpudp_stats 10m;

    # 关键：在 master 启动阶段（init_by_lua）动态设置 package.path/cpath，
    # 使框架与用户 Lua 代码从本目录的 lua/ 与 lib/ 加载（部署自包含）。
    init_by_lua_block {
        local root = ngx.config.prefix()
        if root:sub(-1) ~= "/" then root = root .. "/" end
        package.path = table.concat({
            root .. "lib/?.lua",
            root .. "lib/?/init.lua",
            root .. "lua/?.lua",
            root .. "lua/?/init.lua",
            package.path,
        }, ";")
        package.cpath = root .. "lib/?.so;" .. package.cpath
        -- 预热转发规则（出错会在此阶段暴露）
        require("framework.config").all()
    }

    init_worker_by_lua_file lua/worker.lua;

    # 由 conf/forward.lua 生成，勿手改（include 相对本配置文件目录 conf/）
    include stream.d/forward.conf;
}
